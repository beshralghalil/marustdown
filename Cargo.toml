[package]
name = "marustdown"
version = "0.1.6"
edition = "2024"
rust-version = "1.92"
description = "A fast, configurable terminal markdown viewer with syntax highlighting, task toggling and keyboard link following"
authors = ["Beshr Alghalil <beshr.alghalil@gmail.com>"]
license = "MIT"
repository = "https://github.com/beshralghalil/marustdown"
homepage = "https://github.com/beshralghalil/marustdown"
readme = "README.md"
keywords = ["markdown", "terminal", "viewer", "pager", "cli"]
categories = ["command-line-utilities", "text-processing"]
include = ["/src", "/assets", "/docs/*.md", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[[bin]]
name = "mar"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "string"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
latex-to-unicode = { version = "0.1", optional = true }
memmap2 = "0.9"
mermaid-text = { version = "0.57", optional = true }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig"], optional = true }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"], optional = true }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["highlight", "math", "mermaid"]
highlight = ["dep:syntect", "dep:two-face"]
math = ["dep:latex-to-unicode"]
mermaid = ["dep:mermaid-text"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"

[dev-dependencies]
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
