[package]
name = "marustdown"
version = "0.1.0"
edition = "2024"
description = "A fast, configurable terminal markdown viewer"
license = "MIT"

[[bin]]
name = "mar"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
memmap2 = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
unicode-width = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
